apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordle-backend
  labels:
    app: wordle-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordle-backend
  template:
    metadata:
      labels:
        app: wordle-backend
    spec:
      containers:
      - name: backend
        image: wordle-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wordle-backend-service
spec:
  selector:
    app: wordle-backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
