name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm install
      
    - name: Run backend tests
      working-directory: ./backend
      run: npm test || echo "No tests defined"
      
    - name: Build backend Docker image
      run: docker build -t wordle-backend:${{ github.sha }} ./backend
      
    - name: Build frontend Docker image
      run: docker build -t wordle-frontend:${{ github.sha }} ./frontend
      
    - name: Run Docker Compose
      run: docker-compose up -d
      
    - name: Wait for services
      run: sleep 10
      
    - name: Check backend health
      run: curl -f http://localhost:3000/health || exit 1
      
    - name: Check frontend availability
      run: curl -f http://localhost:8080 || exit 1
      
    - name: Stop Docker Compose
      run: docker-compose down

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/wordle-backend:latest
        
    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/wordle-frontend:latest
